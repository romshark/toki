cmd: cmd/editor-server
watch:
  # The editor opens this repository, whose texts it localizes itself.
  flags: "--server=localhost:8080 --dir=. -b=internal/tokibundle"
  exclude:
    - ".git/**"
    # The index database of the editor, which writes it as it runs.
    - ".toki/**"
    - ".*"
    - "*~"
    - "examples/**"
  custom-watchers:
    - name: js
      cmd: cd editor/js && node build.mjs js
      include:
        - "editor/js/**/*.ts"
      exclude:
        - "editor/js/node_modules/**"
      debounce: 200ms
      fail-on-error: true
      requires: reload
    - name: css
      cmd: cd editor/js && node build.mjs css
      include:
        - "editor/css/**/*.css"
      debounce: 200ms
      fail-on-error: true
      requires: reload

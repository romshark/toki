name: goreleaser

on:
  push:
    # Run only on tags
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    # macOS, not Linux: the darwin build needs cgo for the desktop app of
    # `toki edit`, and cgo builds for macOS only on macOS.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      # Validate the tag's changelog section and compare link before publishing.
      - name: Cut the release notes from CHANGELOG.md
        run: go run ./internal/tools/release-notes -tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -buildvcs=true
          # The cask is pushed to romshark/homebrew-tools, another repository,
          # which the job's own GITHUB_TOKEN cannot write to. A PAT with
          # contents:write on that repository, as a repository secret of this one.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
